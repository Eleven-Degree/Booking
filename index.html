<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eleven Degree</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eleven Degree">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F1EA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #F5F1EA; font-family: -apple-system, Helvetica, Arial, sans-serif; color: #1d2420; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 120px; height: 120px; border-radius: 26px; margin-bottom: 18px; }
  a.btn { display: inline-block; background: #1f4d36; color: #fff; text-decoration: none; padding: 14px 26px; border-radius: 12px; font-size: 17px; margin-top: 8px; }
  p { max-width: 320px; line-height: 1.5; color: #555; }
</style>
</head>
<body>
<img src="apple-touch-icon.png" alt="Eleven Degree">
<a class="btn" id="go" href="https://script.google.com/macros/s/AKfycby_cuz0eUP5aAchqdQe7ope0VLFlA_XxveiI390JFwStrphsyg1CDEzotBWII1H7wA/exec">Open booking tool</a>
<p id="tip">To install: tap the Share button, then “Add to Home Screen”.</p>
<script>
  // Opened from the Home Screen icon -> go straight to the booking tool.
  // Opened in a normal Safari tab -> stay here so the logo is used as the icon.
  var standalone = (window.navigator.standalone === true) ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) { location.replace(document.getElementById('go').href); }
</script>
</body>
</html>
